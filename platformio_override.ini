# Local override: build esp32dev with the glowline usermod included.
# See platformio_override.sample.ini for the full set of available overrides.

[platformio]
# esp32s3_glowline_pioarduino: 16MB/PSRAM board with dual OTA app slots and a
# real TLS stack (needed for wss://). esp32dev_glowline (4MB, single-app
# partition table, no OTA slots, no TLS) is kept only for quick non-TLS
# testing -- never build/flash a real unit with it. This default_envs was
# previously esp32dev_glowline, so a bare `pio run -t upload` (or VS Code's
# default Upload task, which also omits -e) silently built and flashed a
# non-functional variant. Pin the env explicitly on the build/upload command
# anyway (-e esp32s3_glowline_pioarduino) -- don't rely on this default alone.
default_envs = esp32s3_glowline_pioarduino

[env:esp32dev_glowline]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} glowline

# ESP32-S3, 16MB flash + PSRAM, on the pioarduino platform build instead of
# the default tasmota one -- confirmed (separately) to ship a real,
# non-stubbed NetworkClientSecure/WiFiClientSecure and working mbedtls TLS,
# unlike tasmota's build or the official PlatformIO registry platform (which
# both resolve to the same TLS-stubbed tasmota/arduino-esp32 source). This
# env is the toolchain groundwork for wss:// support; glowline itself is not
# using TLS yet.
[env:esp32s3_glowline_pioarduino]
extends = env:esp32s3dev_16MB_opi
platform = ${esp32_idf_V5.platform_pioarduino}
platform_packages = ${esp32_idf_V5.platform_packages_pioarduino}
custom_usermods = ${env:esp32s3dev_16MB_opi.custom_usermods} glowline
# LED strip wired to GPIO2, powered directly from the board (not a separate
# supply), so capped at 20 LEDs to stay within what the board's 5V/3V3 rail
# can safely source. Default for this env would be GPIO16 (conflicts with
# octal PSRAM pins on this board) and 30 LEDs.
#
# This board is plugged in via its UART bridge chip (not its native USB-OTG
# port), but esp32s3dev_16MB_opi's inherited build_flags set
# ARDUINO_USB_CDC_ON_BOOT=1, which routes Serial to the native USB port
# instead -- so nothing printed by WLED/glowline reached the serial monitor.
# Override it back to 0 so Serial uses the UART bridge that's actually
# connected.
# GLOWLINE_AP_SSID renames the setup access point to Lumen-XXXX (last 4
# hex chars of the MAC) instead of WLED-AP; WLED_AP_PASS="" makes it an open
# network (no password) to match. WLED_AP_SSID is also defined (to a value
# that's never actually used -- GLOWLINE_AP_SSID's own snprintf overrides
# apSSID directly) purely to satisfy wled.h's guard against pairing a custom
# password with the still-default SSID.
# GLOWLINE_MDNS_PREFIX makes the default mDNS/hostname lumen-XXXXXX (last 6 hex chars of the MAC)
# instead of wled-XXXXXX. Only boards with no saved mDNS name get it; cfg.json keeps a saved one.
# SERVERNAME sets the default device name (UI title, Home Assistant, /json/info "name") to "Lumen";
# like the mDNS name it only applies to boards with no saved name. Side effect: serial Improv then
# reports "Lumen" instead of the mDNS name (wled00/improv.cpp compares against "WLED").
build_flags = ${env:esp32s3dev_16MB_opi.build_flags} -D DATA_PINS=2 -D PIXEL_COUNTS=20 -D ARDUINO_USB_CDC_ON_BOOT=0 -D GLOWLINE_AP_SSID -D WLED_AP_SSID=\"Lumen-AP\" -D WLED_AP_PASS=\"\" -D GLOWLINE_MDNS_PREFIX=\"lumen\" -D SERVERNAME=\"Lumen\"

# BENCH TESTING ONLY. Drops the OTA rollback-confirmation timeout (glowline.cpp's
# OTA_VERIFY_TIMEOUT_MS) from 15 minutes to 2, so a rollback can actually be observed within a
# normal test cycle instead of waiting a quarter hour each time. The name is deliberately long and
# ugly so it can't be selected by accident; glowline.cpp also prints an unmissable warning banner
# on every boot whenever this timeout isn't the real 15-minute value, as a second safeguard in
# case this ever gets flashed onto a unit that ships.
# NEVER flash a real/shipped unit with this environment.
[env:esp32s3_glowline_pioarduino_BENCH_2MIN_ROLLBACK_DO_NOT_SHIP]
extends = env:esp32s3_glowline_pioarduino
build_flags = ${env:esp32s3_glowline_pioarduino.build_flags} -D OTA_VERIFY_TIMEOUT_MS=120000UL

# Lumen release envs: identical to esp32s3_glowline_pioarduino except for the build-default backend
# host (glowline.cpp's LUMEN_DEVICE_HOST), which only applies to boards with no saved host --
# existing boards keep theirs. lumen_prod ships; lumen_dev points new boards at the dev Worker.
# lumen_prod also sets LUMEN_LEGACY_HOST: boards saved with exactly the old workers.dev host move
# to the new host, persisted only after the first successful connect to it. Never set it in dev:
# a prod-provisioned board moved to the dev Worker would fail auth (separate database).
[env:esp32s3_lumen_prod]
extends = env:esp32s3_glowline_pioarduino
build_flags = ${env:esp32s3_glowline_pioarduino.build_flags} -D LUMEN_DEVICE_HOST=\"devices.buylumen.com\" -D LUMEN_LEGACY_HOST=\"glowline-app.cedericfrank.workers.dev\"

[env:esp32s3_lumen_dev]
extends = env:esp32s3_glowline_pioarduino
build_flags = ${env:esp32s3_glowline_pioarduino.build_flags} -D LUMEN_DEVICE_HOST=\"glowline-app-dev.cedericfrank.workers.dev\"

# BENCH TESTING ONLY -- measures BLE (Improv-shaped GATT server) heap cost; see
# usermods/ble_heap_probe/readme.md. Based on lumen_dev and forces the dev host in memory
# (GLOWLINE_BENCH_FORCE_DEFAULT_HOST): bench boards keep the old prod host saved in cfg.json, and
# this image must never reach prod. The saved host is never overwritten.
# NEVER flash a real/shipped unit with this environment.
[env:esp32s3_lumen_dev_BENCH_BLE_HEAP_DO_NOT_SHIP]
extends = env:esp32s3_lumen_dev
custom_usermods = ${env:esp32s3_lumen_dev.custom_usermods} ble_heap_probe
build_flags = ${env:esp32s3_lumen_dev.build_flags} -D LUMEN_BLE_HEAP_PROBE -D GLOWLINE_BENCH_FORCE_DEFAULT_HOST -D GLOWLINE_FW_VERSION=\"1.2.1-bleheap\"

# BENCH TESTING ONLY -- H6 rollback test on lumen_dev: never completes a WebSocket connection
# (GLOWLINE_OTA_TEST_FORCE_BAD_HOST, in memory only; the saved host is never overwritten) and rolls
# back after 2 minutes. The suffixed version is pinned here so this image never carries a real one.
# NEVER flash a real/shipped unit with this environment.
[env:esp32s3_lumen_dev_BENCH_2MIN_ROLLBACK_DO_NOT_SHIP]
extends = env:esp32s3_lumen_dev
build_flags = ${env:esp32s3_lumen_dev.build_flags} -D OTA_VERIFY_TIMEOUT_MS=120000UL -D GLOWLINE_OTA_TEST_FORCE_BAD_HOST -D GLOWLINE_FW_VERSION=\"1.3.0-h6\"

# BENCH TESTING ONLY -- legacy-host migration failure path: prod migration flags, but the new host is
# a name that never resolves (RFC 2606 .invalid), so the board must roll back after 2 minutes with
# cfg.json still holding the legacy host. Extends the base env (not lumen_prod) so LUMEN_DEVICE_HOST
# is defined once.
# NEVER flash a real/shipped unit with this environment.
[env:esp32s3_lumen_prod_BENCH_2MIN_MIGRATION_FAIL_DO_NOT_SHIP]
extends = env:esp32s3_glowline_pioarduino
build_flags = ${env:esp32s3_glowline_pioarduino.build_flags} -D LUMEN_DEVICE_HOST=\"lumen-bench.invalid\" -D LUMEN_LEGACY_HOST=\"glowline-app.cedericfrank.workers.dev\" -D OTA_VERIFY_TIMEOUT_MS=120000UL -D GLOWLINE_FW_VERSION=\"1.3.0-migfail\"

# BENCH TESTING ONLY -- TLS certificate verification negative tests (release 1.4.0). Each forces the
# host in memory (GLOWLINE_OTA_TEST_FORCE_BAD_HOST + GLOWLINE_OTA_TEST_BAD_HOST_NAME; the saved host
# is never overwritten) to a badssl.com host whose certificate must be rejected, so TLS never
# completes and the image rolls back after 2 minutes. CORE_DEBUG_LEVEL=1 (these envs only) makes the
# core print mbedTLS's rejection reason on serial. Versions are pinned so these images never carry a
# real one.
# NEVER flash a real/shipped unit with these environments.
[env:esp32s3_lumen_dev_BENCH_2MIN_TLS_SELFSIGNED_DO_NOT_SHIP]
extends = env:esp32s3_lumen_dev
build_unflags = -D CORE_DEBUG_LEVEL=0
build_flags = ${env:esp32s3_lumen_dev.build_flags} -D CORE_DEBUG_LEVEL=1 -D OTA_VERIFY_TIMEOUT_MS=120000UL -D GLOWLINE_OTA_TEST_FORCE_BAD_HOST -D GLOWLINE_OTA_TEST_BAD_HOST_NAME=\"self-signed.badssl.com\" -D GLOWLINE_FW_VERSION=\"1.4.0-tlsself\"

[env:esp32s3_lumen_dev_BENCH_2MIN_TLS_WRONGHOST_DO_NOT_SHIP]
extends = env:esp32s3_lumen_dev
build_unflags = -D CORE_DEBUG_LEVEL=0
build_flags = ${env:esp32s3_lumen_dev.build_flags} -D CORE_DEBUG_LEVEL=1 -D OTA_VERIFY_TIMEOUT_MS=120000UL -D GLOWLINE_OTA_TEST_FORCE_BAD_HOST -D GLOWLINE_OTA_TEST_BAD_HOST_NAME=\"wrong.host.badssl.com\" -D GLOWLINE_FW_VERSION=\"1.4.0-tlshost\"

# BENCH TESTING ONLY -- positive check of the prod device host's certificate before any prod OTA:
# forces devices.buylumen.com in memory. TLS must verify ("TLS handshake complete"); the dev
# credentials then get 401 from the prod Worker, so it never connects and rolls back after 2 minutes.
# NEVER flash a real/shipped unit with this environment.
[env:esp32s3_lumen_dev_BENCH_2MIN_TLS_PRODHOST_DO_NOT_SHIP]
extends = env:esp32s3_lumen_dev
build_unflags = -D CORE_DEBUG_LEVEL=0
build_flags = ${env:esp32s3_lumen_dev.build_flags} -D CORE_DEBUG_LEVEL=1 -D OTA_VERIFY_TIMEOUT_MS=120000UL -D GLOWLINE_OTA_TEST_FORCE_BAD_HOST -D GLOWLINE_OTA_TEST_BAD_HOST_NAME=\"devices.buylumen.com\" -D GLOWLINE_FW_VERSION=\"1.4.0-tlsprod\"
